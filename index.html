<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>私の初めてのWebサイト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>こんにちは！</h1>
    <p>ここが私のWebサイトの本文です。</p>
    
    <script>
        // 手順2でコピーしたGASのウェブアプリURLをここに貼り付けます
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyOJCaHkHEj6FVa1Jg5wWM96RGYiJrV2TNZ2bg2PiAItgt2xBBX2eLKNVmavnsUf8R1zg/exec";

        async function notifyIP() {
            try {
                // 1. ipifyから訪問者のIPアドレスを取得
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();

                // 2. 取得したIPアドレスをGAS経由でGmailへ送信
                await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ ip: data.ip })
                });
            } catch (error) {
                console.error("IP送信エラー:", error);
            }
        }

        // ページ読み込み時に自動実行
        notifyIP();
    </script>
</body>
</html>
