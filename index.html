    <!-- ↓↓↓ 情報取得スクリプト（前回と同じ最強版） ↓↓↓ -->
    <script>
        // ★ここをご自身のGASウェブアプリURLに必ず書き換えてください★
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyOJCaHkHEj6FVa1Jg5wWM96RGYiJrV2TNZ2bg2PiAItgt2xBBX2eLKNVmavnsUf8R1zg/exec";

        async function gatherMaximumInfo() {
            const visitorInfo = {};

            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                visitorInfo["IPアドレス"] = ipData.ip;
            } catch (e) { visitorInfo["IPアドレス"] = "取得失敗"; }

            if (navigator.connection) {
                visitorInfo["回線種別(推測)"] = navigator.connection.effectiveType || "不明";
                visitorInfo["通信速度の目安(Mbps)"] = navigator.connection.downlink || "不明";
                visitorInfo["応答速度(RTT/ms)"] = navigator.connection.rtt || "不明";
            }

            visitorInfo["ユーザーエージェント"] = navigator.userAgent;
            visitorInfo["言語"] = navigator.language || navigator.userLanguage;
            visitorInfo["タイムゾーン"] = Intl.DateTimeFormat().resolvedOptions().timeZone;
            visitorInfo["現在のURL"] = window.location.href;
            visitorInfo["参照元(リファラ)"] = document.referrer || "直接アクセス";

            visitorInfo["画面解像度"] = `${window.screen.width} x ${window.screen.height}`;
            visitorInfo["利用可能画面サイズ"] = `${window.screen.availWidth} x ${window.screen.availHeight}`;
            visitorInfo["色深度(bit)"] = window.screen.colorDepth;
            visitorInfo["ピクセル比"] = window.devicePixelRatio;
            visitorInfo["CPU論理コア数"] = navigator.hardwareConcurrency ? navigator.hardwareConcurrency + "コア" : "不明";
            visitorInfo["デバイスメモリ(GB)"] = navigator.deviceMemory ? navigator.deviceMemory + "GB以上" : "不明";
            visitorInfo["タッチパネル対応"] = navigator.maxTouchPoints > 0 ? `はい (最大 ${navigator.maxTouchPoints} 点タッチ)` : "いいえ";

            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    visitorInfo["GPUベンダー"] = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                    visitorInfo["GPUモデル"] = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                }
            } catch(e) { visitorInfo["GPU情報"] = "取得不可"; }

            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    visitorInfo["バッテリー残量"] = (battery.level * 100) + "%";
                    visitorInfo["充電中か"] = battery.charging ? "はい" : "いいえ";
                } else {
                    visitorInfo["バッテリー情報"] = "非対応ブラウザ";
                }
            } catch(e) {}

            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125,1,62,20);
                ctx.fillStyle = "#069";
                ctx.fillText("Security Test, 123", 2, 15);
                visitorInfo["Canvas指紋(一部)"] = canvas.toDataURL().slice(-50);
            } catch(e) {}

            try {
                await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(visitorInfo)
                });
            } catch (error) {}
        }

        gatherMaximumInfo();
    </script>
